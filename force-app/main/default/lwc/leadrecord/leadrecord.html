<template>
    <lightning-card title = "Lead Details" icon-name = "standard:lead">
        <div class = "slds-p-around_medium">
                <lightning-input
                    label="Lead Name"
                    value={lead.leadName}
                    onchange={handleLeadName}>
                </lightning-input>

                <lightning-combobox
                    label="Lead Source"
                    value={lead.leadSource}
                    options={sourceOptions}
                    onchange={handleLeadSource} >
                </lightning-combobox>

                <lightning-input
                    type="number"
                    label="Annual Revenue"
                    value={lead.annualRevenue}
                    onchange={handleAnnualRevenue} >
                </lightning-input>

                <lightning-input
                    type="email"
                    label="email"
                    value={lead.email}
                    onchange={handleEmail} >
                </lightning-input>
                
            
        </div>
        <template if:true={error}>
            <div class = "slds-p-around_medium slds-text-color_error slds-m-top_small">
                <p class = "slds-text-color_error">All fields are Mandatory</p>
            </div>
        </template>
        <div    class = "slds-p-around_medium"> 
            <lightning-button class = "slds-m-left_small" variant = "brand" label = "Add" onclick = {handleAdd}></lightning-button>
            <lightning-button class = "slds-m-left_small" variant = "neutral" label = "Clear" onclick = {handleClear}></lightning-button>
            <lightning-button class = "slds-m-left_small" variant = "brand" label = "Display" onclick = {handleDisplay}>
                
            </lightning-button>
        </div>
                <!-- Display Leads -->
      
            <template if:true={showLeads}>
                 

                <template if:true={hasLeads}>  
                     <div class = "slds-p-around_medium">
                                       
                    <lightning-datatable
                        key-field="id"
                        data={leads}
                        columns={columns}>
                    </lightning-datatable>
                    </div>
                </template>
    
            </template>

             <template if:false={hasLeads}>
                <div class = "slds-p-around_medium">
                    <p class = "slds-text-color_error">No Leads to Display</p>
                </div>
           </template>
          
    </lightning-card>
</template>

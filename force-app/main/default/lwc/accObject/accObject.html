<template>
    <lightning-card title = "Lead Details" icon-name = "standard:lead">
        <div class = "slds-p-around_medium">
                <lightning-input
                    label="Lead Name"
                    value={lead.leadName}
                    onchange={handleLeadName}>
                </lightning-input>

                <lightning-combobox
                    label="Lead Source"
                    value={lead.leadSource}
                    options={sourceOptions}
                    onchange={handleLeadSource} >
                    </lightning-combobox>

                <lightning-input
                    type="number"
                    label="Annual Revenue"
                    value={lead.annualRevenue}
                    onchange={handleAnnualRevenue} >
                    </lightning-input>

                <lightning-input
                    type="email"
                    label="Email"
                    value={lead.Email}
                    onchange={handleEmail} >
                    </lightning-input>
                
            
        </div>
        <div    class = "slds-p-around_medium"> 
            <lightning-button class = "slds-m-left_small" variant = "brand" label = "Add" onclick = {handleAdd}></lightning-button>
            <lightning-button class = "slds-m-left_small" variant = "neutral" label = "Clear" onclick = {handleClear}></lightning-button>
            <lightning-button class = "slds-m-left_small" variant = "brand" label = "Display" onclick = {handleDisplay}>
                
            </lightning-button>
        </div>
        
    </lightning-card>
</template>

<template>
    <lightning-card title = "Wire using Function">
        <div>
           LastName : {LastName}
           <br>Email : {Email}
           <br>Title: {Title}
        </div>
    </lightning-card>

    <lightning-card title = "Wire using Property">
        <template lwc:if={contactDetailsProperty.data}>
        <div>
            {contactDetailsProperty.data.fields.LastName.value}
            {contactDetailsProperty.data.fields.Email.value}
            {contactDetailsProperty.data.fields.Title.value}
        </div>
        </template>
    </lightning-card>


    <lightning-card title = "Wire using Property get field value">
        <template lwc:if={contactDetailsProperty.data}>
        <div>
            Email : {contact_Email_Data}
        </div>
        </template>
    </lightning-card>
</template>
